<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">有视频，就能做字幕</title>
  <desc id="desc">字幕生成示意：视频画面配上清晰的中文字幕。不需要提前准备 SRT，提供视频即可开始转写、校对和烧录。</desc>
  <defs>
    <clipPath id="frame-clip"><rect x="642" y="64" width="486" height="292" rx="12"/></clipPath>
  </defs>
  <rect width="1200" height="440" rx="20" fill="#f5f4f0"/>
  <g id="promise" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="76" font-weight="700" letter-spacing="-2">
    <text x="64" y="178">有视频，</text>
    <text x="64" y="272">就能做字幕。</text>
  </g>
  <g id="voice-track" fill="none" stroke="#96958f" stroke-width="4" stroke-linecap="round">
    <path d="M68 344H102 M116 333V355 M130 322V366 M144 336V352 M158 313V375 M172 327V361 M186 337V351 M200 321V367 M214 330V358 M228 338V350 M242 326V362 M256 316V372 M270 332V356 M284 338V350 M298 329V359 M312 336V352 M326 344H414"/>
    <path d="M444 344H480L469 333M480 344L469 355" stroke="#171717" stroke-width="2.5"/>
  </g>
  <g id="captioned-frame">
    <rect x="626" y="80" width="486" height="292" rx="12" fill="#d7d6d0"/>
    <g clip-path="url(#frame-clip)">
      <rect x="642" y="64" width="486" height="292" fill="#292b2a"/>
      <circle cx="1010" cy="126" r="33" fill="#bdbfb8"/>
      <path d="M612 245L770 127L945 296L1158 211V390H612Z" fill="#61655e"/>
      <path d="M612 296L818 207L1005 322L1158 270V390H612Z" fill="#3f443f"/>
      <path d="M612 349L771 283L958 352L1158 315V390H612Z" fill="#1d2320"/>
    </g>
    <rect x="683" y="274" width="404" height="62" rx="8" fill="#171717" fill-opacity="0.88"/>
    <text x="885" y="315" text-anchor="middle" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="34" font-weight="600">让每句话，都被看见</text>
    <g id="timeline" fill="#b9b8b1">
      <rect x="642" y="398" width="92" height="6" rx="3"/>
      <rect x="744" y="398" width="162" height="6" rx="3"/>
      <rect x="916" y="398" width="72" height="6" rx="3"/>
      <rect x="998" y="398" width="130" height="6" rx="3"/>
    </g>
    <path d="M838 386V416" stroke="#171717" stroke-width="2"/>
    <circle cx="838" cy="384" r="4" fill="#171717"/>
  </g>
</svg>
