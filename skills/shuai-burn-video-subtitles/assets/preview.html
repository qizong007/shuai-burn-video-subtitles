<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shuai · 字幕校对</title>
<script>
const THEME_KEY = "burn-subs:theme";
let themePreference = "auto";
try {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (["auto", "light", "dark"].includes(savedTheme)) themePreference = savedTheme;
} catch (_) { /* The editor also works when browser storage is unavailable. */ }
function applyTheme(now = new Date()) {
  const hour = now.getHours();
  document.documentElement.dataset.theme = themePreference === "auto"
    ? (hour >= 7 && hour < 19 ? "light" : "dark")
    : themePreference;
  const button = document.getElementById("btnTheme");
  if (button) {
    const dark = document.documentElement.dataset.theme === "dark";
    button.querySelector(".theme-sun").toggleAttribute("hidden", dark);
    button.querySelector(".theme-moon").toggleAttribute("hidden", !dark);
    button.setAttribute("aria-label", dark ? "切换为浅色主题" : "切换为深色主题");
    button.title = `${dark ? "深色" : "浅色"}（${themePreference === "auto" ? "按时间自动" : "手动"}）；点击切换，右键恢复自动`;
  }
}
applyTheme();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f5;
    --surface: #fff;
    --border: #dedede;
    --text: #171717;
    --muted: #666;
    --accent: #171717;
    --on-accent: #fff;
    --hover: #f2f2f2;
    --current: #e8e8e8;
    --mark: #ffe69a;
    --mark-text: #332500;
    --mark-active: #b73832;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111;
    --surface: #181818;
    --border: #383838;
    --text: #f5f5f5;
    --muted: #aaa;
    --accent: #f5f5f5;
    --on-accent: #171717;
    --hover: #242424;
    --current: #303030;
    --mark: #69541d;
    --mark-text: #fff3ca;
    --mark-active: #e59c52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .app-header {
    height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 16px;
    padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .wordmark { position: relative; overflow: hidden; width: 96px; height: 38px; flex-shrink: 0; }
  .wordmark img {
    position: absolute; width: 124px; height: auto; max-width: none;
    left: 50%; top: 50%; transform: translate(-50%, -50%); mix-blend-mode: multiply;
  }
  .wordmark .wordmark-dark { display: none; mix-blend-mode: screen; }
  :root[data-theme="dark"] .wordmark .wordmark-light { display: none; }
  :root[data-theme="dark"] .wordmark .wordmark-dark { display: block; }
  .app-title { padding-left: 16px; border-left: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .app-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .srt-picker { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; }
  .srt-picker::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px;
    border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .srt-picker label { flex-shrink: 0; color: var(--muted); }
  .srt-picker select { appearance: none; min-width: 100px; max-width: min(280px, 30vw); padding: 5px 28px 5px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
  .workspace { flex: 1; min-height: 0; display: flex; }
  .video-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .video-wrap {
    flex: 1; min-height: 0; background: #000;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .video-wrap video { width: 100%; height: 100%; object-fit: contain; }
  .current-subtitle {
    position: absolute; z-index: 7; bottom: 7.5%; left: 50%;
    transform: translateX(-50%); max-width: 70%;
    text-align: center;
    font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(13px, 2.05vw, 22px);
    font-weight: 600; line-height: 1.34; color: #fff;
    background: rgba(28, 26, 26, 0.76);
    padding: 4px 10px; border-radius: 8px;
    pointer-events: none; white-space: pre-wrap; word-break: break-word;
    display: none;
  }
  .current-subtitle.visible { display: block; }
  .content-progress {
    display: none; position: absolute; left: 0; right: 0; bottom: 0;
    height: 28px; background: linear-gradient(transparent, rgba(0,0,0,.45));
  }
  .content-progress.visible { display: block; }
  .content-progress-fill {
    position: absolute; left: 0; top: 18px; height: 3px;
    background: #fff; width: 0;
  }
  .content-progress-label {
    position: absolute; top: 2px; overflow: hidden;
    color: #fff; font-size: 10px; white-space: nowrap; opacity: .85;
  }
  .list-pane {
    width: 380px; flex-shrink: 0; background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .list-header, .panel-footer, .find-bar {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .panel-footer { border-bottom: 0; border-top: 1px solid var(--border); flex-direction: column; align-items: stretch; }
  .btn {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: var(--hover); }
  input[type="checkbox"] { accent-color: var(--accent); }
  [hidden] { display: none !important; }
  .btn:disabled, .icon-btn:disabled { opacity: .4; cursor: default; }
  .icon-btn:disabled:hover { color: var(--muted); background: transparent; }
  button:focus-visible, select:focus-visible, input:focus-visible, .sub-text:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn.save {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    font-weight: 600; padding: 8px 16px; font-size: 13px; width: 100%;
  }
  .save-actions { display: flex; gap: 8px; }
  .save-actions .save { flex: 1; width: auto; }
  .find-bar { display: none; flex-wrap: wrap; }
  .find-bar.show { display: flex; }
  .find-row { display: flex; align-items: center; gap: 6px; width: 100%; }
  .find-row .btn { flex-shrink: 0; }
  .find-status { width: 100%; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .find-bar input {
    flex: 1; min-width: 90px; border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 12px;
    background: var(--surface); color: var(--text);
  }
  .find-bar input::placeholder { color: var(--muted); }
  .list-header { font-size: 12px; color: var(--muted); flex-wrap: wrap; gap: 6px; min-height: 49px; }
  #listInfo { flex: 1; white-space: nowrap; }
  .history-controls { display: flex; gap: 2px; padding-left: 6px; border-left: 1px solid var(--border); }
  .subtitle-list { flex: 1; overflow: auto; }
  .sub-item {
    display: grid; grid-template-columns: 18px 78px minmax(0, 1fr) 68px;
    gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border);
    cursor: pointer; align-items: center;
  }
  .sub-item:hover { background: var(--hover); }
  .sub-item.current { background: var(--current); box-shadow: inset 3px 0 var(--accent); }
  .sub-item.selected { outline: 1px solid var(--muted); outline-offset: -1px; }
  .sub-item.search-hit { outline: 2px solid var(--mark-active); outline-offset: -2px; }
  .sub-item.is-hidden .sub-text { color: var(--muted); opacity: .65; }
  .sub-item > input[type="checkbox"] { justify-self: center; margin: 0; }
  .sub-times {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10px; color: var(--muted); line-height: 1.2;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .time-divider { width: 1px; height: 8px; background: var(--muted); opacity: .5; }
  .sub-text { font-size: 13px; line-height: 1.45; min-height: 1.4em; outline: none; white-space: pre-wrap; overflow-wrap: anywhere; }
  .sub-actions { display: flex; gap: 12px; }
  .icon-btn {
    width: 28px; height: 28px; flex-shrink: 0; display: inline-flex;
    align-items: center; justify-content: center; border-radius: 5px;
    border: 0; background: transparent; cursor: pointer; color: var(--muted);
  }
  .icon-btn:hover { color: var(--text); background: var(--hover); }
  .icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .panel-status { font-size: 12px; color: var(--muted); min-height: 16px; }
  mark { background: var(--mark); color: var(--mark-text); padding: 0; border-radius: 2px; }
  mark.search-current { background: var(--mark-active); color: var(--surface); }
</style>
</head>
<body>
  <header class="app-header">
    <div class="wordmark"><img class="wordmark-light" src="/brand/shuai-wordmark.png" alt="shuai" width="1774" height="887"><img class="wordmark-dark" src="/brand/shuai-wordmark-dark.png" alt="shuai" width="1774" height="887"></div>
    <span class="app-title">字幕工作台</span>
    <div class="app-actions" role="group" aria-label="工作台设置">
      <div class="srt-picker">
        <label for="srtSelect">当前 SRT</label>
        <select id="srtSelect" aria-label="切换 SRT 文件" disabled></select>
      </div>
      <button class="icon-btn" id="btnTheme" aria-label="切换主题">
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
      </button>
    </div>
  </header>
  <main class="workspace">
  <div class="video-pane">
    <div class="video-wrap">
      <video id="vid" controls src="/video"></video>
      <div class="current-subtitle" id="curSub"></div>
      <div class="content-progress" id="contentProgress">
        <div class="content-progress-fill" id="contentProgressFill"></div>
        <div id="contentProgressLabels"></div>
      </div>
    </div>
  </div>
  <div class="list-pane">
    <div class="list-header" role="group" aria-label="字幕操作">
      <span id="listInfo" aria-live="polite"></span>
      <button class="btn" id="btnFind" aria-expanded="false" aria-controls="findBar">查找</button>
      <button class="btn" id="btnMerge" hidden>合并</button>
      <button class="btn" id="btnHideSelected" disabled hidden>隐藏</button>
      <div class="history-controls" role="group" aria-label="操作历史">
        <button class="icon-btn" id="btnUndo" aria-label="撤回" title="撤回（Cmd/Ctrl+Z）" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-5 5 5 5M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg></button>
        <button class="icon-btn" id="btnRedo" aria-label="重做" title="重做（Cmd/Ctrl+Y）" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12" transform="translate(0 -2)"/></svg></button>
      </div>
    </div>
    <div class="find-bar" id="findBar">
      <div class="find-row">
        <input id="findInput" placeholder="查找文字" aria-label="查找文字">
        <button class="btn" id="btnFindPrev" title="Shift+Enter">上一处</button>
        <button class="btn" id="btnFindNext" title="Enter">下一处</button>
        <button class="icon-btn" id="btnFindClose" aria-label="关闭查找">×</button>
      </div>
      <div class="find-status" id="findStatus" role="status" aria-live="polite">输入文字开始查找</div>
      <div class="find-row">
        <input id="replaceInput" placeholder="替换为（可留空）" aria-label="替换为">
        <button class="btn" id="btnReplaceOne">替换当前</button>
        <button class="btn" id="btnReplaceAll">全部替换</button>
      </div>
    </div>
    <div class="subtitle-list" id="list"></div>
    <div class="panel-footer">
      <div class="panel-status" id="statusText">单击跳转，双击编辑，Cmd/Ctrl+F 查找</div>
      <div class="save-actions">
        <button class="btn save" id="btnSave" disabled>保存</button>
        <button class="btn" id="btnSaveAs" disabled>另存为</button>
      </div>
    </div>
  </div>
  </main>
<script>
const LEGACY_LS_KEY = __CACHE_KEY__;
let LS_KEY = LEGACY_LS_KEY;
let currentSource = "";
let fileBusy = false;
let segments = [];
let selectedIds = new Set();
let findIndex = -1;
let findMatches = [];
let currentNeedle = "";
let manifest = null;
let chapters = [];
const HISTORY_LIMIT = 50;
let undoStack = [];
let redoStack = [];

const vid = document.getElementById("vid");
const curSub = document.getElementById("curSub");
const listEl = document.getElementById("list");
const findInput = document.getElementById("findInput");
const repInput = document.getElementById("replaceInput");
const listInfo = document.getElementById("listInfo");
const statusTxt = document.getElementById("statusText");
const findBarEl = document.getElementById("findBar");
const contentProgress = document.getElementById("contentProgress");
const contentProgressFill = document.getElementById("contentProgressFill");
const contentProgressLabels = document.getElementById("contentProgressLabels");
const themeButton = document.getElementById("btnTheme");
const srtSelect = document.getElementById("srtSelect");
const saveAsBtn = document.getElementById("btnSaveAs");
function setThemePreference(theme) {
  themePreference = theme;
  try { localStorage.setItem(THEME_KEY, themePreference); } catch (_) {}
  applyTheme();
}
themeButton.addEventListener("click", () => {
  setThemePreference(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});
themeButton.addEventListener("contextmenu", e => { e.preventDefault(); setThemePreference("auto"); });
applyTheme();
setInterval(applyTheme, 60_000);
window.addEventListener("focus", () => applyTheme());
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) applyTheme();
});

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}
function textMatches(text, needle) {
  if (!needle) return [];
  return [...text.matchAll(new RegExp(escapeRe(needle), "gi"))].map(match => ({
    start: match.index, end: match.index + match[0].length,
  }));
}
function insertMarks(text, needle, activeStart = -1) {
  let html = "", offset = 0;
  for (const match of textMatches(text, needle)) {
    html += escapeHtml(text.slice(offset, match.start));
    html += `<mark${match.start === activeStart ? ' class="search-current" aria-current="true"' : ''}>${escapeHtml(text.slice(match.start, match.end))}</mark>`;
    offset = match.end;
  }
  return html + escapeHtml(text.slice(offset));
}
function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(2).padStart(5, "0");
  return `${m}:${sec}`;
}
function visibleSegments() {
  return segments.filter(s => !s.hidden);
}

function mergeableSelection() {
  const indexes = segments.flatMap((s, index) => selectedIds.has(s._id) ? [index] : []);
  if (indexes.length < 2 || indexes.some((index, offset) =>
    segments[index].hidden || index !== indexes[0] + offset)) return null;
  return indexes;
}

const ICONS = {
  edit: '<path d="m16 3 5 5-12 12-6 1 1-6Z"/><path d="m14 5 5 5"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a20 20 0 0 1-3 3.8M6.4 6.4A22 22 0 0 0 2 12s3.5 7 10 7a12 12 0 0 0 5.6-1.4M10 10a3 3 0 0 0 4 4"/>',
};
function icon(name) {
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
}

function renderCurrentSubtitle(seg) {
  if (!seg) {
    curSub.classList.remove("visible");
    curSub.textContent = "";
    return;
  }
  curSub.textContent = (seg.text || "").trim();
  curSub.classList.add("visible");
}

function setupContentProgress() {
  const duration = Number(manifest?.duration || 0);
  const enabled = duration > 180 && chapters.length > 1;
  contentProgress.classList.toggle("visible", enabled);
  contentProgressLabels.replaceChildren();
  if (!enabled) return;
  chapters.forEach((chapter, index) => {
    const startPercent = Math.max(0, Math.min(100, Number(chapter.start) / duration * 100));
    const endPercent = Math.max(startPercent, Math.min(100, Number(chapter.end) / duration * 100));
    const label = document.createElement("span");
    label.className = "content-progress-label";
    label.style.left = `${startPercent}%`;
    label.style.width = `${endPercent - startPercent}%`;
    label.textContent = chapter.title || `第 ${index + 1} 节`;
    contentProgressLabels.appendChild(label);
  });
}

function updateContentProgress(time) {
  const duration = Number(manifest?.duration || vid.duration || 0);
  if (!contentProgress.classList.contains("visible") || !duration) return;
  contentProgressFill.style.width = `${Math.max(0, Math.min(duration, time || 0)) / duration * 100}%`;
}

function syncCurSub(doScroll) {
  const t = vid.currentTime;
  let active = null;
  for (const s of segments) {
    // Shared boundaries belong to the next cue: [start, end).
    if (!s.hidden && t >= s.start && t < s.end) { active = s; break; }
  }
  renderCurrentSubtitle(active);
  document.querySelectorAll(".sub-item").forEach(el => {
    const isActive = active && el.dataset.id == active._id;
    el.classList.toggle("current", !!isActive);
    if (isActive && doScroll !== false && !currentNeedle) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
}

function render() {
  refreshFindMatches();
  listEl.innerHTML = "";
  segments.forEach((seg, index) => {
    const id = seg._id || (seg._id = Math.random().toString(36).slice(2));
    const item = document.createElement("div");
    item.className = "sub-item" + (seg.hidden ? " is-hidden" : "") + (selectedIds.has(id) ? " selected" : "");
    item.dataset.id = id;

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = selectedIds.has(id);
    check.setAttribute("aria-label", `选择字幕 ${index + 1}`);
    check.addEventListener("click", e => {
      e.stopPropagation();
      check.checked ? selectedIds.add(id) : selectedIds.delete(id);
      item.classList.toggle("selected", check.checked);
      updateInfo();
    });

    const times = document.createElement("div");
    times.className = "sub-times";
    times.setAttribute("aria-label", `开始 ${fmt(seg.start)}，结束 ${fmt(seg.end)}`);
    const startTime = document.createElement("span");
    startTime.textContent = fmt(seg.start);
    const divider = document.createElement("span");
    divider.className = "time-divider";
    divider.setAttribute("aria-hidden", "true");
    const endTime = document.createElement("span");
    endTime.textContent = fmt(seg.end);
    times.append(startTime, divider, endTime);

    const textEl = document.createElement("div");
    textEl.className = "sub-text";
    if (currentNeedle) textEl.innerHTML = insertMarks(seg.text || "", currentNeedle);
    else textEl.textContent = seg.text || "";
    textEl.addEventListener("dblclick", e => { e.stopPropagation(); startEdit(id, textEl); });
    textEl.addEventListener("blur", () => {
      if (textEl.contentEditable === "true") {
        finishEdit(id, textEl.innerText.trim());
        textEl.contentEditable = "false";
        paintFindResults();
        syncCurSub(false);
      }
    });
    textEl.addEventListener("keydown", e => {
      if (e.key === "Escape") { textEl.contentEditable = "false"; render(); }
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); textEl.blur(); }
    });

    const actions = document.createElement("div");
    actions.className = "sub-actions";
    const editBtn = document.createElement("button");
    editBtn.className = "icon-btn";
    editBtn.innerHTML = icon("edit");
    editBtn.setAttribute("aria-label", "编辑字幕");
    editBtn.title = "编辑字幕";
    editBtn.addEventListener("click", e => { e.stopPropagation(); startEdit(id, textEl); });
    const visibilityBtn = document.createElement("button");
    visibilityBtn.className = "icon-btn visibility-btn";
    visibilityBtn.innerHTML = icon(seg.hidden ? "eyeOff" : "eye");
    visibilityBtn.setAttribute("aria-label", seg.hidden ? "显示字幕" : "隐藏字幕");
    visibilityBtn.setAttribute("aria-pressed", String(!seg.hidden));
    visibilityBtn.title = seg.hidden ? "显示字幕" : "隐藏字幕";
    visibilityBtn.addEventListener("click", e => { e.stopPropagation(); toggleHidden(id); });
    actions.append(editBtn, visibilityBtn);

    item.addEventListener("click", () => {
      if (textEl.contentEditable === "true") return;
      vid.currentTime = seg.start;
      syncCurSub(false);
    });
    item.append(check, times, textEl, actions);
    listEl.appendChild(item);
  });
  updateInfo();
  syncCurSub(false);
  paintFindResults();
}

function startEdit(id, textEl) {
  textEl.contentEditable = "true";
  const seg = segments.find(s => s._id === id);
  textEl.textContent = seg ? seg.text || "" : "";
  textEl.focus();
}

function finishEdit(id, value) {
  const seg = segments.find(s => s._id === id);
  if (seg) commitChange(() => { seg.text = value; });
}

function toggleHidden(id) {
  const seg = segments.find(s => s._id === id);
  if (!seg) return;
  commitChange(() => { seg.hidden = !seg.hidden; });
  render();
}

function updateInfo() {
  const total = segments.length;
  const vis = visibleSegments().length;
  listInfo.textContent = `共 ${total} 条`
    + (selectedIds.size ? ` · 已选 ${selectedIds.size}` : "")
    + (total - vis ? ` · 隐藏 ${total - vis}` : "");
  document.getElementById("btnMerge").hidden = !mergeableSelection();
  document.getElementById("btnHideSelected").hidden = selectedIds.size === 0;
  document.getElementById("btnHideSelected").disabled = !segments.some(s => selectedIds.has(s._id) && !s.hidden);
}

function saveLS() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ version: 2, segments })); } catch (_) {}
}

function captureState() {
  return { segments: JSON.parse(JSON.stringify(segments)), selectedIds: [...selectedIds] };
}
function updateHistoryButtons() {
  document.getElementById("btnUndo").disabled = !undoStack.length;
  document.getElementById("btnRedo").disabled = !redoStack.length;
}
function commitChange(change) {
  const before = captureState();
  change();
  if (JSON.stringify(before.segments) === JSON.stringify(segments)) return;
  undoStack.push(before);
  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack = [];
  saveLS();
  updateHistoryButtons();
  document.getElementById("btnSave").disabled = fileBusy;
  refreshFindMatches();
  paintFindResults();
}
function restoreHistory(from, to, label) {
  if (!from.length) return;
  to.push(captureState());
  if (to.length > HISTORY_LIMIT) to.shift();
  const state = from.pop();
  segments = state.segments;
  selectedIds = new Set(state.selectedIds);
  findIndex = -1;
  saveLS();
  render();
  updateHistoryButtons();
  document.getElementById("btnSave").disabled = fileBusy;
  statusTxt.textContent = label;
}
document.getElementById("btnUndo").addEventListener("click", () => restoreHistory(undoStack, redoStack, "已撤回"));
document.getElementById("btnRedo").addEventListener("click", () => restoreHistory(redoStack, undoStack, "已重做"));

function toggleFind(force) {
  commitActiveEdit();
  const show = force ?? !findBarEl.classList.contains("show");
  findBarEl.classList.toggle("show", show);
  document.getElementById("btnFind").setAttribute("aria-expanded", String(show));
  currentNeedle = show ? findInput.value : "";
  findIndex = -1;
  render();
  if (show) { findInput.focus(); findInput.select(); locateFindMatch(); }
}
document.getElementById("btnFind").addEventListener("click", () => toggleFind());
document.getElementById("btnFindClose").addEventListener("click", () => toggleFind(false));

document.addEventListener("keydown", e => {
  const typing = e.target.closest('textarea, input:not([type="checkbox"]), [contenteditable="true"]');
  const command = e.ctrlKey || e.metaKey;
  if (command && !e.altKey && !typing && !e.isComposing) {
    const key = e.key.toLowerCase();
    if (!e.shiftKey && (key === "z" || key === "y")) {
      e.preventDefault();
      if (key === "y") restoreHistory(redoStack, undoStack, "已重做");
      else restoreHistory(undoStack, redoStack, "已撤回");
      return;
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
    e.preventDefault();
    toggleFind(true);
  }
  if (e.key === "Escape" && findBarEl.classList.contains("show")) {
    toggleFind(false);
  }
});

function refreshFindMatches() {
  const previous = findMatches[findIndex];
  findMatches = segments.flatMap((seg, cueIndex) =>
    textMatches(seg.text || "", currentNeedle).map(match => ({ ...match, id: seg._id, cueIndex })));
  const retained = previous && findIndex >= 0
    ? findMatches.findIndex(match => match.id === previous.id && match.start === previous.start) : -1;
  findIndex = findMatches.length ? (retained >= 0 ? retained : Math.max(0, Math.min(findIndex, findMatches.length - 1))) : -1;
}

function paintFindResults() {
  const active = findMatches[findIndex];
  listEl.querySelectorAll(".sub-item").forEach(item => {
    const seg = segments.find(s => s._id === item.dataset.id);
    item.classList.toggle("search-hit", item.dataset.id === active?.id);
    const text = item.querySelector(".sub-text");
    if (text.contentEditable !== "true") {
      text.innerHTML = insertMarks(seg?.text || "", currentNeedle, item.dataset.id === active?.id ? active.start : -1);
    }
  });
  const hasHidden = findMatches.some(match => segments[match.cueIndex].hidden);
  document.getElementById("findStatus").textContent = !currentNeedle ? "输入文字开始查找"
    : active ? `第 ${findIndex + 1} / 共 ${findMatches.length} 处 · 字幕第 ${active.cueIndex + 1} 条`
      + (segments[active.cueIndex].hidden ? "（已隐藏）" : hasHidden ? "（含隐藏字幕）" : "")
    : `未找到“${currentNeedle}”（0 处）`;
  ["btnFindPrev", "btnFindNext", "btnReplaceOne", "btnReplaceAll"].forEach(id => {
    document.getElementById(id).disabled = !active;
  });
}

function locateFindMatch() {
  const active = findMatches[findIndex];
  if (!active) return;
  vid.pause();
  vid.currentTime = segments[active.cueIndex].start;
  syncCurSub(false);
  listEl.querySelector("mark.search-current")?.scrollIntoView({ block: "nearest" });
}

function navigateFind(direction) {
  if (!findMatches.length) return;
  findIndex = (findIndex + direction + findMatches.length) % findMatches.length;
  paintFindResults();
  locateFindMatch();
}

function replaceMatches(all) {
  const active = findMatches[findIndex];
  if (!active) return;
  const count = all ? findMatches.length : 1;
  const nextIndex = findIndex;
  const replacement = repInput.value;
  commitChange(() => {
    if (all) {
      segments.forEach(seg => {
        seg.text = (seg.text || "").replace(new RegExp(escapeRe(currentNeedle), "gi"), () => replacement);
      });
    } else {
      const seg = segments[active.cueIndex];
      seg.text = seg.text.slice(0, active.start) + replacement + seg.text.slice(active.end);
    }
  });
  refreshFindMatches();
  if (!all) {
    // Continue after the replacement, even when the replacement contains the query.
    const next = findMatches.findIndex(match => match.cueIndex > active.cueIndex
      || (match.cueIndex === active.cueIndex && match.start >= active.start + replacement.length));
    findIndex = next >= 0 ? next : 0;
  } else findIndex = Math.min(nextIndex, findMatches.length - 1);
  render();
  locateFindMatch();
  statusTxt.textContent = `已替换 ${count} 处`;
}

findInput.addEventListener("input", () => {
  currentNeedle = findInput.value;
  findIndex = -1;
  render();
  locateFindMatch();
});
document.getElementById("btnFindPrev").addEventListener("click", () => navigateFind(-1));
document.getElementById("btnFindNext").addEventListener("click", () => navigateFind(1));
document.getElementById("btnReplaceOne").addEventListener("click", () => replaceMatches(false));
document.getElementById("btnReplaceAll").addEventListener("click", () => replaceMatches(true));
findInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); navigateFind(e.shiftKey ? -1 : 1); }
});

document.getElementById("btnHideSelected").addEventListener("click", () => {
  let count = 0;
  commitChange(() => {
    segments.forEach(s => {
      if (selectedIds.has(s._id) && !s.hidden) { s.hidden = true; count++; }
    });
    selectedIds.clear();
  });
  statusTxt.textContent = `已隐藏 ${count} 条，可点击眼睛图标恢复`;
  render();
});
document.getElementById("btnMerge").addEventListener("click", () => {
  const indexes = mergeableSelection();
  if (!indexes) return;
  const cues = indexes.map(index => segments[index]);
  const merged = {
    ...cues[0], end: cues[cues.length - 1].end,
    text: cues.map(s => (s.text || "").trim()).join(" "),
  };
  commitChange(() => {
    segments.splice(indexes[0], indexes.length, merged);
    selectedIds = new Set([merged._id]);
  });
  statusTxt.textContent = `已合并 ${cues.length} 条字幕`;
  render();
});

function commitActiveEdit() {
  const active = document.activeElement;
  if (active && active.classList.contains("sub-text")) active.blur();
}
function plainSegments() {
  return segments.map(({ _id, ...rest }) => rest);
}
function setFileBusy(busy) {
  fileBusy = busy;
  document.getElementById("btnSave").disabled = busy;
  saveAsBtn.disabled = busy;
  srtSelect.disabled = busy;
}
async function postJSON(path, body) {
  const res = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: currentSource, ...body })
  });
  if (!res.ok) {
    const error = await res.json();
    throw new Error(error.error || "请求失败，请重试");
  }
  return res;
}

document.getElementById("btnSave").addEventListener("click", async () => {
  if (fileBusy) return;
  commitActiveEdit();
  const toSave = segments.map(({ _id, ...rest }) => rest);
  const savedContent = JSON.stringify(toSave);
  setFileBusy(true);
  statusTxt.textContent = "正在保存…";
  try {
    const res = await postJSON("/api/transcript", { segments: toSave });
    const result = await res.json();
    const hasNewEdits = JSON.stringify(segments.map(({ _id, ...rest }) => rest)) !== savedContent;
    if (!hasNewEdits) {
      try { localStorage.removeItem(LS_KEY); } catch (_) {}
    }
    statusTxt.textContent = `已保存 ${toSave.length} 条（隐藏 ${result.hidden || 0} 条）`
      + (hasNewEdits ? "，还有新修改未保存" : "，可继续编辑");
  } catch (error) {
    statusTxt.textContent = `保存失败：${error.message}`;
  } finally {
    setFileBusy(false);
  }
});

function loadSubtitle(data, migrateLegacy = false) {
  currentSource = data.current;
  LS_KEY = data.draft_key;
  srtSelect.replaceChildren(...data.files.map(file => {
    const option = document.createElement("option");
    option.value = file.path;
    option.textContent = file.name;
    return option;
  }));
  srtSelect.value = currentSource;
  srtSelect.title = currentSource;
  segments = (data.segments || []).map(s => ({ ...s, _id: Math.random().toString(36).slice(2) }));
  try {
    const cached = localStorage.getItem(LS_KEY) || (migrateLegacy ? localStorage.getItem(LEGACY_LS_KEY) : null);
    const draft = JSON.parse(cached || "null");
    if (draft?.version === 2 && Array.isArray(draft.segments)) {
      segments = draft.segments;
      saveLS();
    }
    if (migrateLegacy && LEGACY_LS_KEY !== LS_KEY) localStorage.removeItem(LEGACY_LS_KEY);
  } catch (_) {}
  selectedIds.clear();
  undoStack = [];
  redoStack = [];
  findIndex = -1;
  render();
  updateHistoryButtons();
}

srtSelect.addEventListener("change", async () => {
  if (fileBusy) { srtSelect.value = currentSource; return; }
  const target = srtSelect.value;
  commitActiveEdit();
  saveLS();
  vid.pause();
  const workspace = document.querySelector(".workspace");
  workspace.inert = true;
  setFileBusy(true);
  statusTxt.textContent = "正在切换…";
  try {
    const res = await postJSON("/api/subtitles/switch", { path: target });
    loadSubtitle(await res.json());
    statusTxt.textContent = "已切换，原文件编辑进度已保留";
  } catch (error) {
    srtSelect.value = currentSource;
    statusTxt.textContent = `切换失败：${error.message}`;
  } finally {
    workspace.inert = false;
    setFileBusy(false);
  }
});
// Refresh the list when opening it so newly created SRTs are available.
srtSelect.addEventListener("focus", async () => {
  try {
    const res = await fetch("/api/subtitles", { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    if (data.current !== currentSource) return;
    srtSelect.replaceChildren(...data.files.map(file => new Option(file.name, file.path)));
    srtSelect.value = currentSource;
  } catch (_) {}
});

function fileWriteUnavailable(error) {
  return ["NotAllowedError", "SecurityError", "NotSupportedError"].includes(error.name);
}
function downloadSrt(blob, name) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60_000);
}

saveAsBtn.addEventListener("click", async () => {
  if (fileBusy) return;
  commitActiveEdit();
  const toExport = plainSegments();
  const name = srtSelect.selectedOptions[0].textContent.replace(/\.srt$/i, "") + "_导出.srt";
  setFileBusy(true);
  try {
    let handle = null;
    let downloadFallback = false;
    if (window.showSaveFilePicker) {
      try {
        handle = await window.showSaveFilePicker({
          suggestedName: name,
          types: [{ description: "SRT 字幕", accept: { "application/x-subrip": [".srt"] } }]
        });
      } catch (error) {
        if (!fileWriteUnavailable(error)) throw error;
        downloadFallback = true;
      }
    }
    const res = await postJSON("/api/export", { segments: toExport });
    const blob = await res.blob();
    const filename = handle?.name || name;
    if (handle) {
      let writable = null;
      try {
        writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        statusTxt.textContent = `已另存为 ${filename}`;
        return;
      } catch (error) {
        if (writable) { try { await writable.abort(); } catch (_) {} }
        if (!fileWriteUnavailable(error)) throw error;
        downloadFallback = true;
      }
    }
    downloadSrt(blob, filename);
    statusTxt.textContent = (downloadFallback ? "浏览器限制直接写入，已改为下载 " : "已发起下载 ") + filename;
  } catch (error) {
    statusTxt.textContent = error.name === "AbortError" ? "已取消另存为" : `另存为失败：${error.message}`;
  } finally {
    setFileBusy(false);
  }
});

vid.addEventListener("timeupdate", () => { syncCurSub(); updateContentProgress(vid.currentTime); });
vid.addEventListener("seeking", () => syncCurSub(false));
vid.addEventListener("seeked", () => syncCurSub(false));
vid.addEventListener("loadedmetadata", setupContentProgress);

async function init() {
  manifest = await (await fetch("/manifest")).json();
  chapters = Array.isArray(manifest.chapters) ? manifest.chapters : [];
  const data = await (await fetch("/api/transcript", { cache: "no-store" })).json();
  loadSubtitle(data, true);
  setFileBusy(false);
  setupContentProgress();
  syncCurSub(false);
}
init().catch(error => { statusTxt.textContent = `加载失败：${error.message}，请刷新重试`; });
</script>
</body>
</html>
